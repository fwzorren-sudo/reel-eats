<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Reel Eats</title>
  <meta name="description" content="Restaurants you saved from Instagram, on a map, with the branch closest to home." />
  <meta name="theme-color" content="#f7f4f6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#151114" media="(prefers-color-scheme: dark)" />
  <script>
    // The color theme picked in Settings, applied before the page draws so it doesn't flash.
    try {
      var t = JSON.parse(localStorage.getItem("reel-eats-theme") || "{}");
      if (t.mode === "light" || t.mode === "dark") document.documentElement.dataset.theme = t.mode;
      if (t.accent && t.accent !== "berry") document.documentElement.dataset.accent = t.accent;
    } catch (e) {}
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Reel Eats" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="topbar-row">
        <h1 class="brand">Reel<span>Eats</span></h1>
        <div class="tally num" id="tally"></div>
      </div>
      <div class="filters">
        <div class="segmented" role="group" aria-label="Show">
          <button type="button" data-status="want" aria-pressed="true">To try</button>
          <button type="button" data-status="visited" aria-pressed="false">Visited</button>
          <button type="button" data-status="all" aria-pressed="false">All</button>
        </div>
        <button type="button" class="chip" id="open-filter" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          Open now
        </button>
        <select class="select-chip" id="category-filter" aria-label="Category">
          <option value="">Category</option>
        </select>
        <select class="select-chip" id="city-filter" aria-label="City" hidden>
          <option value="">City</option>
        </select>
      </div>
      <div class="banner" id="banner" role="status" hidden></div>
    </header>

    <main id="main-views">
      <section class="view" id="view-map" aria-label="Map">
        <div id="map"></div>
        <div class="map-tools">
          <button class="round-btn" type="button" id="fit-btn" aria-label="Show all places">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          </button>
          <button class="round-btn" type="button" id="home-btn" aria-label="Center on home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
          </button>
          <button class="round-btn" type="button" id="me-btn" aria-label="Show where I am">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
          </button>
        </div>
        <div class="map-card" id="map-card" hidden></div>
        <div class="map-filters" id="map-filters" role="status" hidden></div>
      </section>

      <section class="view padded" id="view-list" aria-label="List" hidden>
        <div class="list-tools">
          <input class="search" type="search" id="search" placeholder="Search name, dish, city" aria-label="Search" />
          <select class="select-chip" id="sort" aria-label="Sort">
            <option value="home">Nearest home</option>
            <option value="me">Nearest me</option>
            <option value="new">Newest</option>
            <option value="name">A to Z</option>
          </select>
        </div>
        <div class="icon-filters" id="icon-filters" role="group" aria-label="Filter the list">
          <button type="button" class="icon-filter" data-filter="go-soon" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12"/><path d="M7 3v2a5 5 0 005 5 5 5 0 015 5v6M17 3v2a5 5 0 01-5 5 5 5 0 00-5 5v6"/></svg>
            Go soon
          </button>
          <button type="button" class="icon-filter" data-filter="date night" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0112 7.1a4.3 4.3 0 017.5 2.7C19.5 15.4 12 20 12 20z"/></svg>
            Date night
          </button>
          <button type="button" class="icon-filter" data-filter="coffee date" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h12v4a5 5 0 01-5 5H9a5 5 0 01-5-5z"/><path d="M16 11h1.5a2.5 2.5 0 010 5H16"/><path d="M8 3.5v3M12 3.5v3"/></svg>
            Coffee
          </button>
          <button type="button" class="icon-filter" data-filter="cocktails" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16l-8 9z"/><path d="M12 13v7M8 20h8"/></svg>
            Cocktails
          </button>
          <button type="button" class="icon-filter" data-filter="brunch" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18h18"/><path d="M7 18a5 5 0 0110 0"/><path d="M12 6v3M5.6 9.6l1.8 1.8M18.4 9.6l-1.8 1.8"/></svg>
            Brunch
          </button>
          <button type="button" class="icon-filter" data-filter="outdoor seating" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11a9 6.5 0 0118 0z"/><path d="M12 11v10M8 21h8"/></svg>
            Outdoor
          </button>
          <button type="button" class="icon-filter" data-filter="late night" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 019.5 4 7.5 7.5 0 1020 14.5z"/></svg>
            Late night
          </button>
          <button type="button" class="icon-filter" data-filter="under-20" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
            Under $20
          </button>
          <button type="button" class="icon-filter" data-more-filters aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
            <span>More<span class="count"></span></span>
          </button>
        </div>
        <div id="list"></div>
      </section>

      <section class="view padded" id="view-pick" aria-label="Pick" hidden>
        <div id="pick"></div>
      </section>

      <section class="view padded" id="view-settings" aria-label="Settings" hidden>
        <div class="stack" id="settings"></div>
      </section>
    </main>

    <div class="guest-missing" id="guest-missing" hidden>
      <div class="empty"><h2>This link doesn't work</h2><p></p></div>
    </div>

    <button class="fab" type="button" id="add-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Add
    </button>

    <nav class="tabbar" aria-label="Views">
      <button type="button" data-view="map" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>
        Map
      </button>
      <button type="button" data-view="list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>
        List
      </button>
      <button type="button" data-view="pick">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="3" width="11" height="15" rx="2.5" transform="rotate(8 12 10.5)"/><path d="M4.2 7.4l-.7 9.8a2.5 2.5 0 002.3 2.7l7.2.5"/><path d="M12 13.3s-2.8-1.7-2.8-3.8a1.6 1.6 0 012.8-1 1.6 1.6 0 012.8 1c0 2.1-2.8 3.8-2.8 3.8z"/></svg>
        Pick
      </button>
      <button type="button" data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
        Settings
      </button>
    </nav>
  </div>

  <div class="backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <div class="login" id="login" hidden>
    <form class="login-card" id="login-form">
      <h1 class="brand">Reel<span>Eats</span></h1>
      <p>Restaurants from your reels, on one map, with the branch closest to home.</p>
      <label>Access code
        <input type="password" id="login-code" autocomplete="current-password" required />
        <span class="hint">The APP_TOKEN you set when you deployed, or a partner code from the list's owner. It's stored on this phone only.</span>
      </label>
      <div class="error-text" id="login-error" hidden></div>
      <button class="btn primary" type="submit">Open my list</button>
    </form>
  </div>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
